[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "0.1.0"
description = "Document Intelligence Platform — RAG with first-class evaluation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "reportlab>=4.0",
    "unstructured[pdf]>=0.15",
    "pi_heif>=0.18",
    "sentence-transformers>=3.0",
    "tiktoken>=0.7",
    "chromadb>=0.5",
    "openai>=1.40",
    "plotly>=5.20",
    "kaleido>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: end-to-end tests that exercise the full pipeline with fake components",
]

[tool.ruff]
line-length = 100
target-version = "py311"
